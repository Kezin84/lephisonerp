          const sheetCtx = resolveSheetContextForWorkbookJs(calcRefData, state.sheet, ctx, state.sheet);
          rawRows = overlayCalculatedSheetAoaJs(calcRefData, state.sheet, baseSheet, sheetCtx).rows;
        } else {
          rawRows = baseSheet.map(r => [...(r || [])]);
        }
        styledMeta = (calcRefData?.calcSheetsStyled && calcRefData.calcSheetsStyled[state.sheet]) || null;
      } else {
        // Firewall sheet in file_goc_SOPHOS
        const baseFw = refData?.gocFirewallRaw || [];
        rawRows = baseFw.map(r => [...(r || [])]);
        const s = viewerContext.settings || {};
        if (rawRows[3] && s.sector) rawRows[3][7] = s.sector;
        if (rawRows[8] && s.termSubscription) rawRows[8][3] = s.termSubscription;
        if (rawRows[10] && s.qty) rawRows[10][3] = s.qty;
        if (rawRows[12] && s.specialAttribute) rawRows[12][3] = s.specialAttribute;
        if (rawRows[15] && s.model) rawRows[15][7] = s.model;
        if (rawRows[53] && s.description) rawRows[53][7] = s.description;
        if (Array.isArray(viewerContext.rows)) {
          for (const r of viewerContext.rows) {
            const fwR = getFirewallRowForItem(r.name, r.sku);
            if (fwR && rawRows[fwR - 1]) {
              rawRows[fwR - 1][7] = r.sku;
              rawRows[fwR - 1][9] = r.available ? r.msrp : 'NA';
              rawRows[fwR - 1][11] = r.available ? `${r.resellerDisc}%` : '0%';
            }
          }
        }
        styledMeta = refData?.gocFirewallStyled || null;
      }

      const isAcronisSheet = state.fileType === 'acronis_goc' || state.fileType === 'acronis_mau';
      let maxCols = isAcronisSheet ? 4 : 8;
      for (const r of rawRows) {
        if (r && r.length > maxCols) maxCols = r.length;
      }

      // Build merge lookup FIRST: top-left (r,c) -> { rowspan, colspan }, covered (r,c) -> skipped
      const mergeOwner = new Map();
      const mergeCovered = new Set();
      if (styledMeta && Array.isArray(styledMeta.merges)) {
        for (const m of styledMeta.merges) {
          const rowspan = m.bottom - m.top + 1;
          const colspan = m.right - m.left + 1;
          if (rowspan > 1 || colspan > 1) {
            mergeOwner.set(`${m.top},${m.left}`, { rowspan, colspan });
            for (let rr = m.top; rr <= m.bottom; rr++) {
              for (let cc = m.left; cc <= m.right; cc++) {
                if (rr !== m.top || cc !== m.left) {
                  mergeCovered.add(`${rr},${cc}`);
                }
              }
            }
          }
        }
      }

      // Preserve per-column widths from Excel even when trailing empty columns extend maxCols beyond styledMeta.colWidths.length
      const rawColWidths = (styledMeta && Array.isArray(styledMeta.colWidths)) ? styledMeta.colWidths : null;
      const colWidths = Array.from({ length: maxCols }, (_, c) => {
        if (rawColWidths && c < rawColWidths.length && rawColWidths[c] !== null && rawColWidths[c] !== undefined) {
          return Math.max(22, Math.min(540, Number(rawColWidths[c]) || 22));
        }
        return c === 4 ? 360 : (c === 2 || c === 3 ? 220 : 120);
      });

      // Auto-fit column widths so SKU codes and Money / Numeric / Percentage values NEVER wrap onto a second line
      for (let rIdx = 0; rIdx < rawRows.length; rIdx++) {
        const rNum = rIdx + 1;
        const rowArr = rawRows[rIdx] || [];
        for (let cIdx = 0; cIdx < maxCols; cIdx++) {
          const key = `${rNum},${cIdx + 1}`;
          if (mergeCovered.has(key)) continue;
          const cellVal = rowArr[cIdx];
          if (cellVal === null || cellVal === undefined || cellVal === '') continue;
          const disp = formatGridCellValueJs(cellVal, rIdx, cIdx, rowArr);
          if (!disp) continue;
          const isSku = isSkuLikeValJs(cellVal, state.sku);
          const isNum = !isSku && (isNumericMoneyOrPctValJs(cellVal) || isNumericMoneyOrPctValJs(disp));
          if (!isSku && !isNum) continue;

          const neededPx = Math.min(340, Math.ceil(disp.length * (isSku ? 9.6 : 9.0) + 24));
          const spanInfo = mergeOwner.get(key);
          if (spanInfo && spanInfo.colspan > 1) {
            let spanSum = 0;
            const endC = Math.min(maxCols, cIdx + spanInfo.colspan);
            for (let sc = cIdx; sc < endC; sc++) {
              spanSum += colWidths[sc] || 0;
            }
            if (spanSum < neededPx) {
              colWidths[cIdx] = (colWidths[cIdx] || 0) + (neededPx - spanSum);
            }
          } else if (colWidths[cIdx] < neededPx) {
            colWidths[cIdx] = neededPx;
          }
        }
      }

      let html = buildColgroupAndTableOpenHtml(colWidths) + '<thead><tr><th class="col-corner">#</th>';
      for (let c = 0; c < maxCols; c++) {
        const letStr = colIndexToLetter(c);
        const w = Math.max(22, Math.min(540, colWidths[c] || 95));
        html += `<th style="width:${w}px" class="${letStr === state.colLetter ? 'col-active' : ''}">${letStr}</th>`;
      }
      html += '</tr></thead><tbody>';

      let selectedFormulaText = '';
      const palette = (styledMeta && styledMeta.stylePalette) || [];
      const cellStyles2D = (styledMeta && styledMeta.cellStyles) || [];

      for (let rIdx = 0; rIdx < rawRows.length; rIdx++) {
        const rNum = rIdx + 1;
        const rowArr = rawRows[rIdx] || [];
        const isTarget = rNum === state.targetRow;
        if (isTarget) {
          selectedFormulaText = rowArr[state.colIndex] ?? '';
        }

        html += `<tr id="row-${rNum}" class="${isTarget ? 'excel-target-row' : ''}" onclick="selectCell(${rNum}, ${state.colIndex})">`;
        html += `<td class="row-header">${isTarget ? '▶ ' : ''}${rNum}</td>`;

        for (let cIdx = 0; cIdx < maxCols; cIdx++) {
          const cNum = cIdx + 1;
          const key = `${rNum},${cNum}`;
          if (mergeCovered.has(key)) continue;

          const spanInfo = mergeOwner.get(key);
          const spanAttr = spanInfo
            ? `${spanInfo.rowspan > 1 ? ` rowspan="${spanInfo.rowspan}"` : ''}${spanInfo.colspan > 1 ? ` colspan="${spanInfo.colspan}"` : ''}`
            : '';

          const stIdx = cellStyles2D[rIdx] ? cellStyles2D[rIdx][cIdx] : null;
          const stObj = (stIdx !== null && stIdx !== undefined) ? palette[stIdx] : null;
          let css = buildCellCss(stObj);
          const cellVal = rowArr[cIdx];
          const disp = formatGridCellValueJs(cellVal, rIdx, cIdx, rowArr);
          const isSku = isSkuLikeValJs(cellVal, state.sku);
          const isNum = !isSku && (isNumericMoneyOrPctValJs(cellVal) || isNumericMoneyOrPctValJs(disp));
          if ((typeof cellVal === 'number' || isNum) && (!stObj || !stObj.al)) {
            css += 'text-align:right;';
          }
          const isTargetCell = isTarget && cIdx === state.colIndex;
          const clsList = [];
          if (isTargetCell) clsList.push('excel-target-cell');
          if (isSku) clsList.push('cell-sku');
          else if (isNum) clsList.push('cell-nowrap');
          const clsAttr = clsList.length ? ` class="${clsList.join(' ')}"` : '';

          html += `<td${spanAttr}${clsAttr} style="${css}" onclick="event.stopPropagation();selectCell(${rNum}, ${cIdx})">${escapeHtml(disp)}</td>`;
        }

        html += '</tr>';
      }

      html += '</tbody></table>';
      container.innerHTML = html;
      document.getElementById('formulaVal').textContent = selectedFormulaText !== null && selectedFormulaText !== undefined ? String(selectedFormulaText) : '';
    }

    function scrollToTargetRow() {
      setTimeout(() => {
        const container = document.getElementById('gridContainer');
        const targetCell = container ? container.querySelector('.excel-target-cell') : null;
        const rowEl = document.getElementById(`row-${state.targetRow}`);
        const el = targetCell || rowEl;
        if (!container || !el) return;

        const cRect = container.getBoundingClientRect();
        const eRect = el.getBoundingClientRect();
        const stickyTop = 28;
        const stickyLeft = window.innerWidth <= 820 ? 46 : 60;

        const desiredTop = container.scrollTop + (eRect.top - cRect.top) - Math.max(stickyTop + 12, (cRect.height - eRect.height) / 2);
        let desiredLeft = container.scrollLeft;
        if (targetCell) {
          const availW = Math.max(120, cRect.width - stickyLeft);
          const offsetRatio = window.innerWidth <= 820 ? 0.18 : 0.32;
          desiredLeft = container.scrollLeft + (eRect.left - cRect.left) - stickyLeft - Math.max(8, (availW - eRect.width) * offsetRatio);
        }

        container.scrollTo({
          top: Math.max(0, desiredTop),
          left: Math.max(0, desiredLeft),
          behavior: 'smooth'
        });
      }, 80);
    }

        state.targetRow = match.rowNum;
        state.colLetter = match.colLetter;
        state.colIndex = letterToColIndex(match.colLetter);

        if (newFileType === 'acronis_goc' || newFileType === 'acronis_mau') {

          state.targetRow = ov.targetRow;
          state.colLetter = ov.targetColLetter;

    function runSearch() {
      const q = String(document.getElementById('searchInput').value || '').trim().toUpperCase();
      if (!q || (!refData && !calcRefData)) return;

      if (/^\d+$/.test(q)) {
        state.targetRow = parseInt(q, 10);
        renderAll();
        scrollToTargetRow();
        return;
      }

      if (state.fileType === 'acronis_goc' || state.fileType === 'acronis_mau') {
        if (!refData) return;
        const itemsList = state.fileType === 'acronis_goc' ? (refData.gocItems || []) : (refData.mauItems || []);
        const foundInCurrentSheet = itemsList.find(x =>
          x.sheet === state.sheet &&
          (x.sku.includes(q) || x.skuFor.includes(q) || x.tenHang.toUpperCase().includes(q))
        );
        const found = foundInCurrentSheet || itemsList.find(x =>
          x.sku.includes(q) || x.skuFor.includes(q) || x.tenHang.toUpperCase().includes(q)
        );
        if (found) {
          state.sheet = found.sheet;
          state.sku = found.sku || found.skuFor;
          state.targetRow = found.rowNum;
          state.colLetter = 'B';
          state.colIndex = 1;
          renderAll();
          scrollToTargetRow();
        }
        return;
      }

      if ((state.fileType === 'goc' || state.fileType === 'calc') && state.sheet === 'MSRPs&BuyCost') {
        const activeMsrpList = state.fileType === 'calc' ? sortedCalcMsrpCache : sortedMsrpCache;
        const found = activeMsrpList.find(x =>
          x.sku.includes(q) || String(x.pc || '').toUpperCase().includes(q) || String(x.desc || '').toUpperCase().includes(q)
        );
        if (found) {
          state.sku = found.sku;
          state.targetRow = found.rowNum;
          state.colLetter = 'B';
          state.colIndex = 1;
          renderAll();
          scrollToTargetRow();
        }
        return;
      }

      if (state.fileType === 'skulist' && state.sheet === 'SKU_Tab') {
        const found = sortedSkuTabCache.find(x =>
          x.sku.includes(q) || String(x.pc || '').toUpperCase().includes(q) || String(x.desc || '').toUpperCase().includes(q)
        );
        if (found) {
          state.sku = found.sku;
          state.targetRow = found.skuTabRow;
          state.colLetter = 'G';
          state.colIndex = 6;
          renderAll();
          scrollToTargetRow();
        }
        return;
      }

      if (state.fileType === 'skulist' && state.sheet === 'HW_Compliance') {
        const hwRows = refData?.hwComplianceRaw || [];
        for (const rObj of hwRows) {
          const cIdx = (rObj.cells || []).findIndex(v => v !== null && v !== undefined && String(v).toUpperCase().includes(q));
          if (cIdx !== -1) {
            state.targetRow = rObj.rowNum;
            state.colIndex = cIdx;
            state.colLetter = colIndexToLetter(cIdx);
            renderAll();
            scrollToTargetRow();
            return;
          }
        }
        return;
      }

      const baseRowsForSearch = state.fileType === 'tg'
        ? (refData?.tgSheetsRaw && refData.tgSheetsRaw[state.sheet]) || []
        : (state.fileType === 'calc'
          ? (calcRefData?.calcSheetsRaw && calcRefData.calcSheetsRaw[state.sheet]) || []
          : (refData?.gocFirewallRaw || []));
      const rows = (state.fileType === 'calc' && calcRefData?.engineRuntime)
        ? overlayCalculatedSheetAoaJs(calcRefData, state.sheet, baseRowsForSearch, ensureActiveCalcContext()).rows
        : baseRowsForSearch;
      for (let r = 0; r < rows.length; r++) {
        const rowArr = rows[r] || [];
        const cIdx = rowArr.findIndex(v => v !== null && v !== undefined && String(v).toUpperCase().includes(q));
        if (cIdx !== -1) {
          state.targetRow = r + 1;
          state.colIndex = cIdx;
          state.colLetter = colIndexToLetter(cIdx);
          renderAll();
          scrollToTargetRow();
          return;
        }
      }

      // Nếu đang ở chế độ Calculator mà gõ mã SKU / tên sản phẩm bất kỳ -> tự động đưa vào đúng Sheet Calculator và tính giá ngay!
      if (state.fileType === 'calc' && calcRefData && calcRefData.engineRuntime) {
        const foundSkuRow = sortedCalcMsrpCache.find(x =>
          x.sku === q || x.sku.includes(q) || String(x.pc || '').toUpperCase() === q || String(x.desc || '').toUpperCase().includes(q)
        );
        if (foundSkuRow) {
          state.sku = foundSkuRow.sku;
          state.itemName = foundSkuRow.desc;
          activeCalcCtx = inferSophosCalculatorContextJs(calcRefData, foundSkuRow.sku, foundSkuRow.desc);
          state.sheet = activeCalcCtx.nativeSheet || 'Firewall';
          const base = (calcRefData.calcSheetsRaw && calcRefData.calcSheetsRaw[state.sheet]) || [];
          const ov = overlayCalculatedSheetAoaJs(calcRefData, state.sheet, base, activeCalcCtx);
          state.targetRow = ov.targetRow;
          state.colLetter = ov.targetColLetter;
          state.colIndex = letterToColIndex(ov.targetColLetter);
          renderAll();
          scrollToTargetRow();
        }
      }
    }

    function loadSheetJsIfNeeded() {
      if (window.XLSX) return Promise.resolve(window.XLSX);
      return new Promise((resolve, reject) => {
        const sc = document.createElement('script');
        sc.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
        sc.onload = () => {
          if (window.XLSX) resolve(window.XLSX);
          else reject(new Error('Không thể nạp thư viện XLSX Style'));
        };
        sc.onerror = () => {
          const fb = document.createElement('script');
          fb.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
          fb.onload = () => resolve(window.XLSX);
          fb.onerror = () => reject(new Error('Không thể nạp thư viện XLSX'));
          document.head.appendChild(fb);
        };
        document.head.appendChild(sc);
      });
    }

    function loadJsZipIfNeeded() {
      if (window.JSZip) return Promise.resolve(window.JSZip);
      return new Promise((resolve, reject) => {
        const sc = document.createElement('script');
        sc.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
        sc.onload = () => resolve(window.JSZip);
        sc.onerror = () => reject(new Error('Không thể nạp thư viện JSZip'));
        document.head.appendChild(sc);
      });
    }

    async function fetchAndUnzipCalcIndex(urlOrChunks) {
      let fullBytes = null;
      if (Array.isArray(urlOrChunks) && urlOrChunks.length > 0) {
        const buffers = await Promise.all(urlOrChunks.map(async u => {
          const r = await fetch(u);
          if (!r.ok) throw new Error(`Không tải được mảnh chỉ mục Calculator (HTTP ${r.status})`);
          return new Uint8Array(await r.arrayBuffer());
        }));
        const totalLen = buffers.reduce((sum, b) => sum + b.byteLength, 0);
        fullBytes = new Uint8Array(totalLen);
        let offset = 0;
        for (const b of buffers) {
          fullBytes.set(b, offset);
          offset += b.byteLength;
        }
      } else if (typeof urlOrChunks === 'string' && urlOrChunks.trim()) {
        const r = await fetch(urlOrChunks.trim());
        if (!r.ok) throw new Error(`Không tải được chỉ mục Calculator từ Cloudinary (HTTP ${r.status})`);
        fullBytes = new Uint8Array(await r.arrayBuffer());
      } else {
        return null;
      }

      if (fullBytes.length >= 2 && fullBytes[0] === 0x50 && fullBytes[1] === 0x4b) {
        const JSZip = await loadJsZipIfNeeded();
        const zip = await JSZip.loadAsync(fullBytes);
        const entry = zip.file('data.json') || Object.values(zip.files).find(f => !f.dir);
        if (!entry) throw new Error('Gói nén chỉ mục Calculator không chứa data.json');
        const jsonStr = await entry.async('string');
        return JSON.parse(jsonStr);
      }

      const text = new TextDecoder('utf-8').decode(fullBytes);
      return JSON.parse(text);
    }

    function hydrateCalcViewerData(rawCalc) {
      if (!rawCalc || typeof rawCalc !== 'object') return null;
      if (rawCalc.calcSkus && Array.isArray(rawCalc.sortedCalcMsrpRows)) return rawCalc;

      const isV2 = rawCalc.format === 'sophos_calc_v2';
      const pcDict = Array.isArray(rawCalc.pcDict) ? rawCalc.pcDict : [];
      const productByCode = rawCalc.productByCode || {};
      const tuples = Array.isArray(rawCalc.msrpTuples) ? rawCalc.msrpTuples : [];
      const calcSkus = {};
      const sortedCalcMsrpRows = new Array(tuples.length);

      for (let i = 0; i < tuples.length; i++) {
        const t = tuples[i];
        const rowNum = Number(t[0]) || (i + 3);
        const pc = typeof t[1] === 'number' ? (pcDict[t[1]] || '') : String(t[1] || '');
        const sku = String(t[2] || '').trim().toUpperCase();
        const pMeta = pc ? productByCode[pc] : undefined;
        const entry = isV2
          ? {
              rowNum,
              cell: `B${rowNum}`,
              pc,
              sku,
              desc: pMeta ? (pMeta[0] || '') : '',
              prodType: pMeta ? (pMeta[1] || '') : '',
              msrp: Number(t[3]) || 0,
              stdAuth: t[4] !== undefined ? t[4] : null,
              regAuth: t[5] !== undefined ? t[5] : null,
              incAuth: t[6] !== undefined ? t[6] : null,
              stdSilv: t[7] !== undefined ? t[7] : null,
              regSilv: t[8] !== undefined ? t[8] : null,
              incSilv: t[9] !== undefined ? t[9] : null,
              stdGold: t[10] !== undefined ? t[10] : null,
              regGold: t[11] !== undefined ? t[11] : null,
              incGold: t[12] !== undefined ? t[12] : null,
              stdPlat: t[13] !== undefined ? t[13] : null,
              regPlat: t[14] !== undefined ? t[14] : null,
              incPlat: t[15] !== undefined ? t[15] : null,
              stdSel: t[16] !== undefined ? t[16] : null,
              regSel: t[17] !== undefined ? t[17] : null,
              incSel: t[18] !== undefined ? t[18] : null
            }
          : {
              rowNum,
              cell: `B${rowNum}`,
              pc,
              sku,
              desc: pMeta ? (pMeta[0] || '') : '',
              prodType: pMeta ? (pMeta[1] || '') : '',
              msrp: Number(t[3]) || 0,
              stdAuth: t[4] !== undefined ? t[4] : null,
              regAuth: t[5] !== undefined ? t[5] : null,
              incAuth: t[6] !== undefined ? t[6] : null,
              stdSilv: t[7] !== undefined ? t[7] : null,
              regSilv: t[8] !== undefined ? t[8] : null,
              incSilv: null,
              stdGold: t[9] !== undefined ? t[9] : null,
              regGold: t[10] !== undefined ? t[10] : null,
              incGold: null,
              stdPlat: t[11] !== undefined ? t[11] : null,
              regPlat: t[12] !== undefined ? t[12] : null,
              incPlat: null,
              stdSel: null,
              regSel: null,
              incSel: null
            };
        sortedCalcMsrpRows[i] = entry;
        if (sku) calcSkus[sku] = entry;
      }

      const calcVisibleSheetNames = Array.isArray(rawCalc.calcVisibleSheetNames) && rawCalc.calcVisibleSheetNames.length
        ? rawCalc.calcVisibleSheetNames
        : Object.keys(rawCalc.calcSheetsRaw || {});
      const engineRuntime = rawCalc.engineMeta ? hydrateSophosEngineRuntimeJs(rawCalc.engineMeta) : null;

      return {
        format: rawCalc.format || 'sophos_calc_v1',
        version: rawCalc.version || '',
        effectiveFrom: rawCalc.effectiveFrom || '',
        region: rawCalc.region || 'ASEAN',
        currency: rawCalc.currency || 'USD',
        fileName: rawCalc.fileName || 'calculate_sophos.xlsx',
        updatedAt: rawCalc.updatedAt || 0,
        skuCount: tuples.length,
        calcSkus,
        sortedCalcMsrpRows,
        calcVisibleSheetNames,
        calcHiddenSheetNames: Array.isArray(rawCalc.calcHiddenSheetNames) ? rawCalc.calcHiddenSheetNames : ['MSRPs&BuyCost'],
        calcSheetNames: calcVisibleSheetNames,
        calcSheetsRaw: normalizeSophosCalcSheetsRawToA1Js(rawCalc.calcSheetsRaw),
        calcSheetsStyled: rawCalc.calcSheetsStyled || {},
        engineMeta: rawCalc.engineMeta || null,
        engineRuntime,
        productByCode
      };
    }

    function normalizeSophosCalcSheetsRawToA1Js(rawSheets) {
      if (!rawSheets || typeof rawSheets !== 'object') return {};
      const out = {};
      for (const [sName, srcRows] of Object.entries(rawSheets)) {
        if (!Array.isArray(srcRows) || !srcRows.length) {
          out[sName] = Array.isArray(srcRows) ? srcRows : [];
          continue;
        }
        let rows = srcRows;
        if (sName === 'Quick MSRP look up' && /^sector\b/i.test(String((rows[0] && rows[0][1]) || '').trim())) {
          rows = [[], ...rows];
        }
        let colPad = 0;
        if (sName === 'Advisory services' && /^advisory\s+services$/i.test(String((rows[8] && rows[8][0]) || '').trim())) {
          colPad = 2;
        } else if (
          (sName === 'Mobile' || sName === 'Email' || sName === 'Workspace Protection' || sName === 'Backup & Recovery') &&
          /^sector\b/i.test(String((rows[2] && rows[2][5]) || '').trim())
        ) {
          colPad = 1;
        } else if (
          sName === 'Network Detection & Response' &&
          /^ndr\s+deal\s+settings/i.test(String((rows[7] && rows[7][1]) || '').trim())
        ) {
          colPad = 1;
        } else if (
          sName === 'Discounts' &&
          (/^asean|^americas|^emea|^apj/i.test(String((rows[1] && rows[1][0]) || '').trim()) ||
            /^suggested\s+reseller/i.test(String((rows[8] && rows[8][1]) || '').trim()))
        ) {
          colPad = 1;
        } else if (
          (sName === "What's New!" || sName === 'Partner Resources' || sName === 'Successors') &&
          String((rows[1] && rows[1][0]) || '').trim() !== '' &&
          String((rows[1] && rows[1][1]) || '').trim() === ''
        ) {
          colPad = 1;
        }
        if (colPad > 0) {
          const prefix = new Array(colPad).fill(null);
          rows = rows.map(r => (Array.isArray(r) && r.length ? [...prefix, ...r] : []));
        }
        out[sName] = rows;
      }
      return out;
    }

    const populatedCalcOfficeUrlCache = new Map();
    const populatedCalcOfficeInFlight = new Map();

    function resolveCalcOfficeTargetInfo() {
      const ctx = ensureActiveCalcContext() || inferSophosCalculatorContextJs(calcRefData, state.sku, state.itemName);
      const rawSheets = (calcRefData && calcRefData.calcSheetsRaw) || {};
      const visibleNames = (calcRefData && Array.isArray(calcRefData.calcVisibleSheetNames) && calcRefData.calcVisibleSheetNames.length)
        ? calcRefData.calcVisibleSheetNames
        : Object.keys(rawSheets);
      let targetSheet = String(state.sheet || '').trim();
      if (!targetSheet || targetSheet === 'MSRPs&BuyCost' || targetSheet === 'Drop_Downs' || targetSheet === 'Features' || !rawSheets[targetSheet]) {
        targetSheet = (ctx && ctx.nativeSheet && rawSheets[ctx.nativeSheet])
          ? ctx.nativeSheet
          : (rawSheets['Firewall'] ? 'Firewall' : (visibleNames[0] || 'Cover'));
      }
      const cacheKey = JSON.stringify([
        (calcRefData && calcRefData.updatedAt) || '',
        targetSheet,
        String(state.sku || '').toUpperCase(),
        ctx || {}
      ]);
      return { ctx, targetSheet, cacheKey };
    }

    function buildPopulatedCalcWorkbookJs(XLSX) {
      const { ctx, targetSheet } = resolveCalcOfficeTargetInfo();
      const rawSheets = (calcRefData && calcRefData.calcSheetsRaw) || {};
      const styledSheets = (calcRefData && calcRefData.calcSheetsStyled) || {};
      const visibleNames = (calcRefData && Array.isArray(calcRefData.calcVisibleSheetNames) && calcRefData.calcVisibleSheetNames.length)
        ? [...calcRefData.calcVisibleSheetNames]
        : Object.keys(rawSheets);

      const orderedSheets = [];
      if (rawSheets[targetSheet]) orderedSheets.push(targetSheet);
      for (const sName of visibleNames) {
        if (sName !== targetSheet && rawSheets[sName]) orderedSheets.push(sName);
      }

      const outWb = XLSX.utils.book_new();
      let resolvedTargetRow = Number(state.targetRow) || 29;
      let resolvedTargetColLetter = String(state.colLetter || 'H').toUpperCase();
      let resolvedTargetSku = String(state.sku || (ctx && ctx.sku) || '').toUpperCase();

      for (const sName of orderedSheets) {
        const baseRows = rawSheets[sName] || [];
        const sheetCtx = (calcRefData && calcRefData.engineRuntime && ctx)
          ? resolveSheetContextForWorkbookJs(calcRefData, sName, ctx, targetSheet)
          : ctx;
        const overlaid = (calcRefData && calcRefData.engineRuntime && sheetCtx)
          ? overlayCalculatedSheetAoaJs(calcRefData, sName, baseRows, sheetCtx)
          : { rows: baseRows, targetRow: resolvedTargetRow, targetColLetter: resolvedTargetColLetter, targetSku: resolvedTargetSku };

        if (sName === targetSheet) {
          const curR = resolvedTargetRow - 1;
          const curC = letterToColIndex(resolvedTargetColLetter);
          const cellAtState = overlaid.rows[curR] ? String(overlaid.rows[curR][curC] ?? '').trim().toUpperCase() : '';
          const expected = String(state.sku || overlaid.targetSku || (ctx && ctx.sku) || '').trim().toUpperCase();
          if (state.sheet !== targetSheet || !expected || cellAtState !== expected) {
            resolvedTargetRow = overlaid.targetRow || resolvedTargetRow;
            resolvedTargetColLetter = overlaid.targetColLetter || resolvedTargetColLetter;
          }
          if (overlaid.targetSku) resolvedTargetSku = overlaid.targetSku;
        }

        const ws = XLSX.utils.aoa_to_sheet(overlaid.rows);
        const stMeta = styledSheets[sName];
        const merges = (stMeta && Array.isArray(stMeta.merges)) ? stMeta.merges : [];
        const mergeTopLeftSpan = new Map();
        const mergeCoveredWb = new Set();
        if (merges.length) {
          ws['!merges'] = merges.map(m => {
            const sr = Math.max(0, m.top - 1);
            const sc = Math.max(0, m.left - 1);
            const er = Math.max(0, m.bottom - 1);
            const ec = Math.max(0, m.right - 1);
            const cSpan = ec - sc + 1;
            if (cSpan > 1 || er > sr) {
              mergeTopLeftSpan.set(`${sr},${sc}`, cSpan);
              for (let rr = sr; rr <= er; rr++) {
                for (let cc = sc; cc <= ec; cc++) {
                  if (rr !== sr || cc !== sc) mergeCoveredWb.add(`${rr},${cc}`);
                }
              }
            }
            return { s: { r: sr, c: sc }, e: { r: er, c: ec } };
          });
        }

        const rawColW = (stMeta && Array.isArray(stMeta.colWidths)) ? stMeta.colWidths : [];
        let sheetMaxCols = rawColW.length;
        for (const rArr of overlaid.rows) {
          if (rArr && rArr.length > sheetMaxCols) sheetMaxCols = rArr.length;
        }
        const computedColWpx = Array.from({ length: sheetMaxCols }, (_, c) => {
          if (c < rawColW.length && rawColW[c] !== null && rawColW[c] !== undefined) {
            const w = Number(rawColW[c]);
            return w === 0 ? 0 : Math.max(50, Math.min(420, w || 95));
          }
          return c === 4 ? 320 : 115;
        });

        for (let r = 0; r < overlaid.rows.length; r++) {
          const valRow = overlaid.rows[r] || [];
          for (let c = 0; c < valRow.length; c++) {
            const mKey = `${r},${c}`;
            if (mergeCoveredWb.has(mKey)) continue;
            const val = valRow[c];
            if (val === null || val === undefined || val === '') continue;
            const isSkuCell = isSkuLikeValJs(val, resolvedTargetSku || state.sku);
            let disp = '';
            let isNumCell = false;
            if (typeof val === 'number' && Number.isFinite(val)) {
              isNumCell = true;
              const isMoney = c >= 5 && r >= 10 && val > 0 && !isCalcQuantityCellJs(r, c, valRow);
              disp = isMoney
                ? ('$' + val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }))
                : formatCell(val);
            } else if (!isSkuCell && isNumericMoneyOrPctValJs(val)) {
              isNumCell = true;
              disp = String(val).trim();
            } else if (isSkuCell) {
              disp = String(val).trim();
            }
            if (!isSkuCell && !isNumCell) continue;
            const neededPx = Math.min(320, Math.ceil(disp.length * 9.2 + 24));
            const cSpan = mergeTopLeftSpan.get(mKey) || 1;
            if (cSpan > 1) {
              let spanSum = 0;
              const endC = Math.min(sheetMaxCols, c + cSpan);
              for (let sc = c; sc < endC; sc++) spanSum += computedColWpx[sc] || 0;
              if (spanSum > 0 && spanSum < neededPx) {
                computedColWpx[c] = (computedColWpx[c] || 0) + (neededPx - spanSum);
              }
            } else if (computedColWpx[c] > 0 && computedColWpx[c] < neededPx) {
              computedColWpx[c] = neededPx;
            }
          }
        }
        if (sheetMaxCols > 0) {
          ws['!cols'] = computedColWpx.map(w => (w === 0 ? { hidden: true, wpx: 0 } : { wpx: w }));
        }

        const palette = (stMeta && Array.isArray(stMeta.stylePalette)) ? stMeta.stylePalette : [];
        const cellStyles = (stMeta && Array.isArray(stMeta.cellStyles)) ? stMeta.cellStyles : [];
        if (palette.length && cellStyles.length) {
          for (let r = 0; r < overlaid.rows.length; r++) {
            const stRow = cellStyles[r];
            const valRow = overlaid.rows[r] || [];
            const maxC = Math.max(stRow ? stRow.length : 0, valRow.length);
            for (let c = 0; c < maxC; c++) {
              const pIdx = stRow ? stRow[c] : null;
              const val = valRow[c];
              if ((pIdx === null || pIdx === undefined) && (val === null || val === undefined || val === '')) continue;
              const addr = XLSX.utils.encode_cell({ r, c });
              if (!ws[addr]) ws[addr] = { t: 's', v: '' };
              const pObj = (pIdx !== null && pIdx !== undefined) ? palette[pIdx] : null;
              const isSkuCell = isSkuLikeValJs(val, resolvedTargetSku || state.sku);
              const isNumCell = !isSkuCell && isNumericMoneyOrPctValJs(val);
              const cellStyle = {
                font: {
                  name: 'Calibri',
                  sz: (pObj && pObj.sz) || 10,
                  bold: Boolean(pObj && pObj.b),
                  italic: Boolean(pObj && pObj.i),
                  ...(pObj && pObj.fg ? { color: { rgb: String(pObj.fg).replace('#', '') } } : {})
                },
                alignment: {
                  horizontal: (pObj && pObj.al) || ((typeof val === 'number' || isNumCell) ? 'right' : 'left'),
                  vertical: (pObj && pObj.val) || 'center',
                  wrapText: !(isSkuCell || isNumCell)
                }
              };
              if (pObj && pObj.bg) {
                cellStyle.fill = {
                  patternType: 'solid',
                  fgColor: { rgb: String(pObj.bg).replace('#', '') }
                };
              }
              if (typeof val === 'number' && c >= 5 && r >= 10 && val > 0 && !isCalcQuantityCellJs(r, c, valRow)) {
                ws[addr].z = '$#,##0.00';
              }
              ws[addr].s = cellStyle;
            }
          }
        }

        if (sName === targetSheet && resolvedTargetRow >= 1) {
          const targetR = resolvedTargetRow - 1;
          const targetC = letterToColIndex(resolvedTargetColLetter || 'H');
          let rStart = targetR, rEnd = targetR, cStart = targetC, cEnd = targetC;
          for (const m of merges) {
            if (targetR >= m.top - 1 && targetR <= m.bottom - 1 && targetC >= m.left - 1 && targetC <= m.right - 1) {
              rStart = m.top - 1;
              rEnd = m.bottom - 1;
              cStart = m.left - 1;
              cEnd = m.right - 1;
              break;
            }
          }
          const highlightBorder = {
            top: { style: 'medium', color: { rgb: 'DC2626' } },
            bottom: { style: 'medium', color: { rgb: 'DC2626' } },
            left: { style: 'medium', color: { rgb: 'DC2626' } },
            right: { style: 'medium', color: { rgb: 'DC2626' } }
          };
          for (let hr = rStart; hr <= rEnd; hr++) {
            for (let hc = cStart; hc <= cEnd; hc++) {
              const hAddr = XLSX.utils.encode_cell({ r: hr, c: hc });
              if (!ws[hAddr]) ws[hAddr] = { t: 's', v: '' };
              ws[hAddr].s = {
                fill: { patternType: 'solid', fgColor: { rgb: 'FEF08A' } },
                font: { name: 'Calibri', sz: 11, bold: true, color: { rgb: '991B1B' } },
                alignment: { horizontal: 'center', vertical: 'center', wrapText: false },
                border: highlightBorder
              };
            }
          }
        }

        XLSX.utils.book_append_sheet(outWb, ws, sName.slice(0, 31));
      }

      const lookupSku = String(resolvedTargetSku || state.sku || '').trim().toUpperCase();
      const skuHit = (lookupSku && calcRefData && calcRefData.calcSkus) ? calcRefData.calcSkus[lookupSku] : null;
      const allMsrpRows = Array.isArray(sortedCalcMsrpCache) ? sortedCalcMsrpCache : [];
      if (allMsrpRows.length > 0) {
        const msrpAoa = [
          ['Excel Row', 'SKU', 'Product Code', 'Description', 'Type', 'MSRP (USD)', 'Auth Std', 'Auth Reg', 'Auth Inc', 'Silver Std', 'Gold Std', 'Plat Std']
        ];
        let startIdx = 0;
        if (skuHit) {
          const hitIdx = allMsrpRows.findIndex(x => x && x.sku === lookupSku);
          if (hitIdx >= 0) startIdx = Math.max(0, hitIdx - 25);
        }
        const slice = allMsrpRows.slice(startIdx, startIdx + 120);
        for (const r of slice) {
          if (!r) continue;
          msrpAoa.push([
            r.rowNum, r.sku, r.pc, r.desc, r.prodType, r.msrp,
            r.stdAuth, r.regAuth, r.incAuth, r.stdSilv, r.stdGold, r.stdPlat
          ]);
        }
        const msrpWs = XLSX.utils.aoa_to_sheet(msrpAoa);
        msrpWs['!cols'] = [
          { wpx: 70 }, { wpx: 145 }, { wpx: 115 }, { wpx: 280 }, { wpx: 105 },
          { wpx: 95 }, { wpx: 90 }, { wpx: 90 }, { wpx: 90 }, { wpx: 90 }, { wpx: 90 }, { wpx: 90 }
        ];
        XLSX.utils.book_append_sheet(outWb, msrpWs, 'MSRPs&BuyCost');
      }

      if (!outWb.SheetNames.length) {
        XLSX.utils.book_append_sheet(outWb, XLSX.utils.aoa_to_sheet([['Sophos Reseller Calculator']]), 'Cover');
      }
      outWb.Workbook = { Views: [{ activeTab: 0 }] };
      return {
        wb: outWb,
        targetSheet: outWb.SheetNames[0] || targetSheet,
        targetRow: resolvedTargetRow,
        targetColLetter: resolvedTargetColLetter,
        targetSku: resolvedTargetSku
      };
    }

    async function buildWorkbookFromCurrentRefData() {

          skuHeaders.forEach((h, i) => setCell(wsSku, 7, i, h));
          sortedSkuTabCache.forEach((it, idx) => {

            [
              it.changeVer, it.changeKey, '', it.prevPrice,

              it.hsCode, it.coo,

            ].forEach((v, cIdx) => setCell(wsSku, r, cIdx, v));
          });
          wsSku['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: 7 + sortedSkuTabCache.length - 1, c: 27 } });
          XLSX.utils.book_append_sheet(wb, wsSku, 'SKU_Tab');
        }

        // 2. Sheet HW_Compliance (đặt đúng dòng gốc rObj.rowNum)
        if (Array.isArray(refData.hwComplianceRaw) && refData.hwComplianceRaw.length) {
          const wsHw = {};
          let maxHwR = 10;
          for (const rObj of refData.hwComplianceRaw) {
            if (rObj && rObj.rowNum >= 1) {
              if (rObj.rowNum > maxHwR) maxHwR = rObj.rowNum;
              (rObj.cells || []).forEach((v, idx) => setCell(wsHw, rObj.rowNum, idx, v));
            }
          }
          wsHw['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxHwR - 1, c: 15 } });
          XLSX.utils.book_append_sheet(wb, wsHw, 'HW_Compliance');
        }

        // 3. Sheet Firewall (giữ nguyên đúng số dòng 1..62)
        if (Array.isArray(refData.gocFirewallRaw) && refData.gocFirewallRaw.length) {
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(refData.gocFirewallRaw), 'Firewall');
        }
      }

      if (!wb.SheetNames.length) {
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['File', fInfo.name || 'Excel']]), 'Sheet1');
      }
      return { XLSX, wb };
    }

    function getOfficeActiveCellParam() {
      let targetSheet = String(state.sheet || '').trim();
      let targetR = Number(state.targetRow) || 1;
      let cleanCol = String(state.colLetter || 'B').trim().toUpperCase();
      const cleanSku = String(state.sku || '').trim().toUpperCase();

      if (state.fileType === 'calc') {
        if (calcRefData && calcRefData.calcSheetsRaw) {
          const { ctx, targetSheet: resolvedSheet } = resolveCalcOfficeTargetInfo();
          targetSheet = resolvedSheet;
          if (calcRefData.engineRuntime && ctx && calcRefData.calcSheetsRaw[targetSheet]) {
            const ov = overlayCalculatedSheetAoaJs(calcRefData, targetSheet, calcRefData.calcSheetsRaw[targetSheet], ctx);
            const curR = targetR - 1;
            const curC = letterToColIndex(cleanCol);
            const cellAtState = ov.rows[curR] ? String(ov.rows[curR][curC] ?? '').trim().toUpperCase() : '';
            const expected = String(cleanSku || ov.targetSku || (ctx && ctx.sku) || '').trim().toUpperCase();
            if (state.sheet !== targetSheet || !expected || cellAtState !== expected) {
              targetR = ov.targetRow || targetR;
              cleanCol = ov.targetColLetter || cleanCol;
            }
          }
        } else if (!targetSheet || targetSheet === 'MSRPs&BuyCost' || targetSheet === 'Drop_Downs' || targetSheet === 'Features') {
          targetSheet = 'Firewall';
          targetR = getCalcFirewallRowForItem(state.itemName, cleanSku) || 29;
          cleanCol = 'H';
        }
      } else if (state.fileType === 'goc' || state.fileType === 'skulist') {
        if (targetSheet === 'HW_Compliance') {
          cleanCol = cleanCol || 'B';
        } else {
          targetSheet = 'SKU_Tab';
          if (cleanCol === 'B' || cleanCol === 'H' || !cleanCol) {
            cleanCol = 'G';
          }
          const matched = sortedSkuTabCache.find(x =>
            (cleanSku && x.sku === cleanSku) ||
            (cleanSku && String(x.oldSku || '').trim().toUpperCase() === cleanSku) ||
            x.skuTabRow === targetR ||
            x.rowNum === targetR
          );
          if (matched && matched.skuTabRow) {
            targetR = matched.skuTabRow;
          }
        }
      }

      const cellRef = `${cleanCol}${targetR}`;
      if (!targetSheet) return encodeURIComponent(cellRef);
      const escapedSheet = targetSheet.replace(/'/g, "''");
      return encodeURIComponent(`'${escapedSheet}'!${cellRef}`).replace(/'/g, '%27');
    }

    async function ensureExcelUrlForOfficeView() {
      const fInfo = getActiveFileInfo();
      const rawUrl = String(fInfo.url || '').trim();

      // Với file calculate_sophos: luôn tạo bản .xlsx đã điền đầy đủ Mã SKU, Giá MSRP & Buy Cost (không dùng file template trống công thức)
      if (state.fileType === 'calc' && calcRefData && calcRefData.calcSheetsRaw) {
        const { cacheKey, targetSheet } = resolveCalcOfficeTargetInfo();
        if (populatedCalcOfficeUrlCache.has(cacheKey)) {
          return populatedCalcOfficeUrlCache.get(cacheKey);
        }
        if (populatedCalcOfficeInFlight.has(cacheKey)) {
          return await populatedCalcOfficeInFlight.get(cacheKey);
        }
        const uploadTask = (async () => {
          const { XLSX, wb } = await buildWorkbookFromCurrentRefData();
          const outBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
          const blob = new Blob([outBuffer], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          });
          const safeToken = String(state.sku || targetSheet || 'calc').replace(/[^a-zA-Z0-9_-]+/g, '_').slice(0, 36);
          const safeName = String(fInfo.name || 'calculate_sophos').replace(/\.(xlsb|xls|xlsx|json)$/i, '') + `_${safeToken}_viewoffice.xlsx`;
          const formData = new FormData();
          formData.append('file', blob, safeName);
          formData.append('upload_preset', 'upload_file');
          const res = await fetch('https://api.cloudinary.com/v1_1/db6fzs3rh/raw/upload', {
            method: 'POST',
            body: formData
          });
          if (!res.ok) {
            throw new Error('Không thể tạo file .xlsx đã tính sẵn mã SKU trên Cloudinary cho ViewOffice');
          }
          const data = await res.json();
          const newUrl = data.secure_url;
          if (newUrl) {
            populatedCalcOfficeUrlCache.set(cacheKey, newUrl);
          }
          return newUrl;
        })();
        populatedCalcOfficeInFlight.set(cacheKey, uploadTask);
        try {
          return await uploadTask;
        } finally {
          populatedCalcOfficeInFlight.delete(cacheKey);
        }
      }

      if (rawUrl && !rawUrl.toLowerCase().endsWith('.json')) {
        return rawUrl;
      }

      // Nếu file cũ đang lưu dưới dạng .json -> Tạo file .xlsx đẩy lên Cloudinary để ViewOffice đọc được
      const { XLSX, wb } = await buildWorkbookFromCurrentRefData();
      const outBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
      const blob = new Blob([outBuffer], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });
      const safeName = String(fInfo.name || 'vendor_ref').replace(/\.(xlsb|xls|xlsx|json)$/i, '') + '_slim_viewoffice.xlsx';
      const formData = new FormData();
      formData.append('file', blob, safeName);
      formData.append('upload_preset', 'upload_file');
      const res = await fetch('https://api.cloudinary.com/v1_1/db6fzs3rh/raw/upload', {
        method: 'POST',
        body: formData
      });
      if (!res.ok) {
        throw new Error('Không thể tạo file .xlsx trên Cloudinary cho ViewOffice');
      }
      const data = await res.json();
      const newUrl = data.secure_url;
      if (vendorMeta && newUrl) {
        if (state.fileType.includes('goc')) vendorMeta.goc_file_url = newUrl;
        else if (state.fileType === 'tg') vendorMeta.tg_file_url = newUrl;
        else if (state.fileType === 'skulist') vendorMeta.skulist_file_url = newUrl;
        else if (state.fileType !== 'calc') vendorMeta.mau_file_url = newUrl;
      }
      return newUrl;
    }

    async function downloadActiveFile() {
      const fInfo = getActiveFileInfo();
      const fileName = fInfo.name || 'bang_gia.xlsx';

      // Nếu là file lớn (>10MB) đã chia mảnh nguyên vẹn trên Cloudinary -> Ghép lại đúng 100% file gốc khi tải về
      if (Array.isArray(fInfo.chunkUrls) && fInfo.chunkUrls.length > 0) {
        try {
          const parts = await Promise.all(fInfo.chunkUrls.map(async u => {
            const res = await fetch(u);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.arrayBuffer();
          }));
          const blob = new Blob(parts, {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          });
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 8000);
          return;
        } catch (chunkErr) {
          console.warn('Lỗi tải mảnh file lớn, chuyển sang link dự phòng:', chunkErr);
        }
      }

      const rawUrl = String(fInfo.url || '').trim();

      if (rawUrl && !rawUrl.toLowerCase().endsWith('.json')) {
        try {
          const res = await fetch(rawUrl);
          if (res.ok) {
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
            return;
          }
        } catch (_) {}
        window.open(rawUrl, '_blank', 'noopener,noreferrer');
        return;
      }

      try {
        const { XLSX, wb } = await buildWorkbookFromCurrentRefData();
        const outName = fileName.replace(/\.(xlsb|xls)$/i, '.xlsx');
        XLSX.writeFile(wb, outName);
      } catch (err) {
        alert('Lỗi tải file: ' + (err.message || err));
      }
    }

    function hydrateViewerRefData(raw, isAcronisMode, isKasMode) {
      if (!raw || typeof raw !== 'object') return raw;
      if (isAcronisMode) {
        const gocItems = Array.isArray(raw.gocItems) ? raw.gocItems : [];
        const mauItems = Array.isArray(raw.mauItems) ? raw.mauItems : [];
        const gocBySku = { ...(raw.gocBySku || {}) };
        const gocBySkuFor = { ...(raw.gocBySkuFor || {}) };
        const gocByMaHang = { ...(raw.gocByMaHang || {}) };
        for (const item of gocItems) {
          if (!item) continue;
          const s = String(item.sku || '').trim().toUpperCase();
          const sf = String(item.skuFor || '').trim().toUpperCase();
          const m = String(item.maHang || '').trim().toUpperCase();
          if (s && !gocBySku[s]) gocBySku[s] = item;
          if (sf && !gocBySkuFor[sf]) gocBySkuFor[sf] = item;
          if (m) gocByMaHang[m] = item;
        }
        const mauBySku = { ...(raw.mauBySku || {}) };
        const mauBySkuFor = { ...(raw.mauBySkuFor || {}) };
        const mauByMaHang = { ...(raw.mauByMaHang || {}) };
        for (const item of mauItems) {
          if (!item) continue;
          const s = String(item.sku || '').trim().toUpperCase();
          const sf = String(item.skuFor || '').trim().toUpperCase();
          const m = String(item.maHang || '').trim().toUpperCase();
          if (s && !mauBySku[s]) mauBySku[s] = item;
          if (sf && !mauBySkuFor[sf]) mauBySkuFor[sf] = item;
          if (m) mauByMaHang[m] = item;
        }
        return {
          ...raw,
          gocItems,
          mauItems,
          gocBySku,
          gocBySkuFor,
          gocByMaHang,
          mauBySku,
          mauBySkuFor,
          mauByMaHang
        };
      }
      if (isKasMode) {
        const gocSaleRows = Array.isArray(raw.gocSaleRows) ? raw.gocSaleRows : [];
        const mauSaleRows = Array.isArray(raw.mauSaleRows) ? raw.mauSaleRows : [];
        const gocSaleBySkuBand = { ...(raw.gocSaleBySkuBand || {}) };
        for (const r of gocSaleRows) {
          if (!r || !r.sku || !r.band) continue;
          const key = `${String(r.sku).trim().toUpperCase()}||${String(r.band).trim()}`;
          if (!gocSaleBySkuBand[key]) gocSaleBySkuBand[key] = r;
        }
        const mauSaleBySkuBand = { ...(raw.mauSaleBySkuBand || {}) };
        for (const r of mauSaleRows) {
          if (!r || !r.sku || !r.band) continue;
          const key = `${String(r.sku).trim().toUpperCase()}||${String(r.band).trim()}`;
          if (!mauSaleBySkuBand[key]) mauSaleBySkuBand[key] = r;
        }
        return {
          ...raw,
          gocSaleRows,
          mauSaleRows,
          gocSaleBySkuBand,
          mauSaleBySkuBand
        };
      }
      return raw;
    }

    async function init() {
      try {
        const savedCtx = localStorage.getItem('sophos_excel_viewer_context');
        if (savedCtx) {
          viewerContext = JSON.parse(savedCtx);
        }
      } catch (_) {}

      const params = new URLSearchParams(window.location.search);
      const explicitSheetParam = params.get('sheet') || '';
      const explicitRowParam = params.get('row') || '';
      const explicitColParam = params.get('col') || '';
      state.fileType = params.get('file') || 'tg';
      if (state.fileType === 'calc' && explicitSheetParam === 'MSRPs&BuyCost') {
        showHiddenCalcSheets = true;
      }
      state.sheet = explicitSheetParam || (
        (state.fileType === 'acronis_goc' || state.fileType === 'acronis_mau')
          ? 'Protect Standard'
          : ((state.fileType === 'kas_goc' || state.fileType === 'kas_mau')
            ? 'SMB+Enterprise (License)'
            : (state.fileType === 'calc'
              ? 'Firewall'
              : (state.fileType === 'goc' ? 'MSRPs&BuyCost' : (state.fileType === 'skulist' ? 'SKU_Tab' : 'XGS - 1U + 10%'))))
      );
      state.targetRow = parseInt(explicitRowParam || '1', 10) || 1;
      state.colLetter = (explicitColParam || (state.fileType === 'skulist' && state.sheet === 'SKU_Tab' ? 'G' : (state.fileType === 'calc' && state.sheet === 'Firewall' ? 'H' : 'B'))).toUpperCase();
      state.colIndex = letterToColIndex(state.colLetter);
      state.sku = (params.get('sku') || '').toUpperCase();
      state.itemName = params.get('name') || '';
      state.band = params.get('band') || '';
      state.viewMode = params.get('mode') === 'office' ? 'office' : 'grid';

      const isAcronisMode = state.fileType === 'acronis_goc' || state.fileType === 'acronis_mau';
      const isKasMode = state.fileType === 'kas_goc' || state.fileType === 'kas_mau';
      const vendorKey = isAcronisMode ? 'acronis' : (isKasMode ? 'kaspersky' : 'sophos');

      try {
        const tsNow = Date.now();
        const [liveMeta, mockMeta] = await Promise.all([
          fetch(`https://chusonproject-default-rtdb.asia-southeast1.firebasedatabase.app/vendor_ref_files/${vendorKey}.json?_t=${tsNow}`, { cache: 'no-store' })
            .then(r => (r.ok ? r.json() : null))
            .catch(() => null),
          fetch(`/__mock_rtdb/data?path=vendor_ref_files/${vendorKey}&_t=${tsNow}`, { cache: 'no-store' })
            .then(r => (r.ok ? r.json() : null))
            .catch(() => null)
        ]);
        const mergeMetaFieldGroup = (baseObj, candObj, tsKeys, fields) => {
          if (!candObj || typeof candObj !== 'object') return;
          const getTs = o => {
            if (!o) return 0;
            for (const k of tsKeys) {
              const n = Number(o[k]);
              if (Number.isFinite(n) && n > 0) return n;
            }
            return 0;
          };
          const bTs = getTs(baseObj);
          const cTs = getTs(candObj);
          const hasAnyField = o => o && fields.some(f => o[f] !== undefined && o[f] !== null && o[f] !== '');
          if (!hasAnyField(baseObj) || (hasAnyField(candObj) && cTs >= bTs)) {
            for (const f of fields) {
              if (candObj[f] !== undefined) baseObj[f] = candObj[f];
            }
          }
        };
        if (liveMeta && mockMeta && typeof liveMeta === 'object' && typeof mockMeta === 'object') {
          const merged = { ...liveMeta };
          mergeMetaFieldGroup(merged, mockMeta, ['updated_at', 'tg_updated_at', 'goc_updated_at'], ['index_url', 'index_file_name', 'updated_at']);
          mergeMetaFieldGroup(merged, mockMeta, ['calc_updated_at', 'updated_at'], ['calc_file_url', 'calc_file_chunk_urls', 'calc_file_name', 'calc_index_url', 'calc_index_chunk_urls', 'calc_version', 'calc_sku_count', 'calc_updated_at']);
          mergeMetaFieldGroup(merged, mockMeta, ['tg_updated_at', 'updated_at'], ['tg_file_url', 'tg_file_name', 'tg_updated_at']);
          mergeMetaFieldGroup(merged, mockMeta, ['goc_updated_at', 'updated_at'], ['goc_file_url', 'goc_file_name', 'skulist_file_url', 'skulist_file_name', 'goc_updated_at']);
          mergeMetaFieldGroup(merged, mockMeta, ['mau_updated_at', 'updated_at'], ['mau_file_url', 'mau_file_name', 'mau_updated_at']);
          vendorMeta = merged;
        } else {
          vendorMeta = liveMeta || mockMeta || null;
        }
        const hasMainIndex = Boolean(vendorMeta && vendorMeta.index_url);
        const hasCalcIndex = vendorKey === 'sophos' && Boolean(
          vendorMeta && (vendorMeta.calc_index_url || (Array.isArray(vendorMeta.calc_index_chunk_urls) && vendorMeta.calc_index_chunk_urls.length > 0))
        );
        if (!vendorMeta || (!hasMainIndex && !hasCalcIndex)) {
          throw new Error(`Chưa có File Tham Chiếu của ${vendorKey.toUpperCase()} trên Cloudinary. Vui lòng upload file mới lên Cloudinary tại màn hình Quản lý Hàng Hóa!`);
        }

        const tasks = [];
        if (hasMainIndex) {
          tasks.push(
            fetch(vendorMeta.index_url)
              .then(res => {
                if (!res.ok) throw new Error(`Không tải được dữ liệu gốc từ Cloudinary (HTTP ${res.status}).`);
                return res.json();
              })
              .then(rawJson => {
                refData = hydrateViewerRefData(rawJson, isAcronisMode, isKasMode);
              })
              .catch(err => {
                if (state.fileType !== 'calc') throw err;
                console.warn('Không tải được index_url phụ:', err);
              })
          );
        }
        if (hasCalcIndex) {
          const calcSrc = Array.isArray(vendorMeta.calc_index_chunk_urls) && vendorMeta.calc_index_chunk_urls.length > 0
            ? vendorMeta.calc_index_chunk_urls
            : vendorMeta.calc_index_url;
          tasks.push(
            fetchAndUnzipCalcIndex(calcSrc)
              .then(rawCalc => {
                calcRefData = hydrateCalcViewerData(rawCalc);
              })
              .catch(err => {
                if (state.fileType === 'calc') throw err;
                console.warn('Không tải được calc_index_url:', err);
              })
          );
        }

        await Promise.all(tasks);
        if (!refData && !calcRefData) {
          throw new Error('Không thể giải mã dữ liệu tham chiếu từ Cloudinary.');
        }
      } catch (err) {
        const container = document.getElementById('gridContainer');
        container.innerHTML = `<div style="margin: 40px auto; max-width: 680px; padding: 24px 28px; border-radius: 10px; background: #fef2f2; border: 2px solid #ef4444; color: #991b1b; font-size: 14px; line-height: 1.6;">
          <div style="font-size: 17px; font-weight: 800; margin-bottom: 8px;">⚠️ Không tải được File Tham Chiếu từ Cloudinary</div>
          <div>${escapeHtml(err.message || String(err))}</div>
          <div style="margin-top: 10px; font-size: 12.5px; color: #7f1d1d;">Hệ thống đã tắt chế độ đọc file tĩnh cũ để tránh nhầm lẫn giá. Vui lòng quay lại trang Quản lý Hàng Hóa và bấm <strong>☁️ Upload File mới lên Cloudinary</strong>.</div>
        </div>`;
        return;
      }

      // Build sorted MSRPs&BuyCost cache & SKU_Tab cache
      if (refData) {
        const gocMap = refData.gocSkus || {};
        const arrMsrp = [];
        const arrSkuTab = [];
        for (const [sku, info] of Object.entries(gocMap)) {
          if (info && info.rowNum) {
            arrMsrp.push({ sku, ...info });
          }
          if (info && info.skuTabRow) {
            arrSkuTab.push({ sku, ...info });
          }
        }
        arrMsrp.sort((a, b) => a.rowNum - b.rowNum);
        arrSkuTab.sort((a, b) => a.skuTabRow - b.skuTabRow);
        sortedMsrpCache = arrMsrp;
        sortedSkuTabCache = arrSkuTab;
      }
      if (calcRefData) {
        sortedCalcMsrpCache = calcRefData.sortedCalcMsrpRows || [];
        const ctx = ensureActiveCalcContext();
        if (state.fileType === 'calc' && state.sheet !== 'MSRPs&BuyCost' && calcRefData.engineRuntime && ctx) {
          const rawSheets = calcRefData.calcSheetsRaw || {};
          if (
            !explicitSheetParam ||
            !rawSheets[state.sheet] ||
            (explicitSheetParam === 'Firewall' && ctx.calcType === 'product' && ctx.nativeSheet && ctx.nativeSheet !== 'Firewall' && rawSheets[ctx.nativeSheet])
          ) {
            state.sheet = (ctx.nativeSheet && rawSheets[ctx.nativeSheet]) ? ctx.nativeSheet : 'Firewall';
          }
          if (rawSheets[state.sheet]) {
            const ov = overlayCalculatedSheetAoaJs(calcRefData, state.sheet, rawSheets[state.sheet], ctx);
            const expectedSku = String(ov.targetSku || ctx.sku || state.sku || '').trim().toUpperCase();
            if (expectedSku && (!state.sku || (state.sku === 'CFRAAB12ZZCAA' && expectedSku === 'CFRAAB12BANCAA'))) {
              state.sku = expectedSku;
            }
            const curCell = (state.targetRow >= 1 && ov.rows[state.targetRow - 1])
              ? String(ov.rows[state.targetRow - 1][letterToColIndex(state.colLetter)] ?? '').trim().toUpperCase()
              : '';
            if (!explicitRowParam || (expectedSku && curCell !== expectedSku && ov.targetRow >= 1)) {
              state.targetRow = ov.targetRow || state.targetRow;
              state.colLetter = ov.targetColLetter || (explicitColParam ? state.colLetter : 'H');
              state.colIndex = letterToColIndex(state.colLetter);
            }
          }
        }
      }

      renderAll();
      scrollToTargetRow();
      copyRowCoord(true);
    }

    init();
  </script>
</body>
</html>
