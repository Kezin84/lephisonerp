    async function fetchAndUnzipCalcIndex(urlOrChunks) {
      let fullBytes = null;
      if (Array.isArray(urlOrChunks) && urlOrChunks.length > 0) {
        const buffers = await Promise.all(urlOrChunks.map(async u => {
          const r = await fetch(u);
          if (!r.ok) throw new Error(`Không tải được mảnh chỉ mục Calculator (HTTP ${r.status})`);
          return new Uint8Array(await r.arrayBuffer());
        }));
        const totalLen = buffers.reduce((sum, b) => sum + b.byteLength, 0);
        fullBytes = new Uint8Array(totalLen);
        let offset = 0;
        for (const b of buffers) {
          fullBytes.set(b, offset);
          offset += b.byteLength;
        }
      } else if (typeof urlOrChunks === 'string' && urlOrChunks.trim()) {
        const r = await fetch(urlOrChunks.trim());
        if (!r.ok) throw new Error(`Không tải được chỉ mục Calculator từ Cloudinary (HTTP ${r.status})`);
        fullBytes = new Uint8Array(await r.arrayBuffer());
      } else {
        return null;
      }

      if (fullBytes.length >= 2 && fullBytes[0] === 0x50 && fullBytes[1] === 0x4b) {
        const JSZip = await loadJsZipIfNeeded();
        const zip = await JSZip.loadAsync(fullBytes);
        const entry = zip.file('data.json') || Object.values(zip.files).find(f => !f.dir);
        if (!entry) throw new Error('Gói nén chỉ mục Calculator không chứa data.json');
        const jsonStr = await entry.async('string');
        return JSON.parse(jsonStr);
      }

      const text = new TextDecoder('utf-8').decode(fullBytes);
      return JSON.parse(text);
    }

    function hydrateCalcViewerData(rawCalc) {
      if (!rawCalc || typeof rawCalc !== 'object') return null;
      if (rawCalc.calcSkus && Array.isArray(rawCalc.sortedCalcMsrpRows)) return rawCalc;

      const isV2 = rawCalc.format === 'sophos_calc_v2';
      const pcDict = Array.isArray(rawCalc.pcDict) ? rawCalc.pcDict : [];
      const productByCode = rawCalc.productByCode || {};
      const tuples = Array.isArray(rawCalc.msrpTuples) ? rawCalc.msrpTuples : [];
      const calcSkus = {};
      const sortedCalcMsrpRows = new Array(tuples.length);

      for (let i = 0; i < tuples.length; i++) {
        const t = tuples[i];
        const rowNum = Number(t[0]) || (i + 3);
        const pc = typeof t[1] === 'number' ? (pcDict[t[1]] || '') : String(t[1] || '');
        const sku = String(t[2] || '').trim().toUpperCase();
        const pMeta = pc ? productByCode[pc] : undefined;
        const entry = isV2
          ? {
              rowNum,
              cell: `B${rowNum}`,
              pc,
              sku,
              desc: pMeta ? (pMeta[0] || '') : '',
              prodType: pMeta ? (pMeta[1] || '') : '',
              msrp: Number(t[3]) || 0,
              stdAuth: t[4] !== undefined ? t[4] : null,
              regAuth: t[5] !== undefined ? t[5] : null,
              incAuth: t[6] !== undefined ? t[6] : null,
              stdSilv: t[7] !== undefined ? t[7] : null,
              regSilv: t[8] !== undefined ? t[8] : null,
              incSilv: t[9] !== undefined ? t[9] : null,
              stdGold: t[10] !== undefined ? t[10] : null,
              regGold: t[11] !== undefined ? t[11] : null,
              incGold: t[12] !== undefined ? t[12] : null,
              stdPlat: t[13] !== undefined ? t[13] : null,
              regPlat: t[14] !== undefined ? t[14] : null,
              incPlat: t[15] !== undefined ? t[15] : null,
              stdSel: t[16] !== undefined ? t[16] : null,
              regSel: t[17] !== undefined ? t[17] : null,
              incSel: t[18] !== undefined ? t[18] : null
            }
          : {
              rowNum,
              cell: `B${rowNum}`,
              pc,
              sku,
              desc: pMeta ? (pMeta[0] || '') : '',
              prodType: pMeta ? (pMeta[1] || '') : '',
              msrp: Number(t[3]) || 0,
              stdAuth: t[4] !== undefined ? t[4] : null,
              regAuth: t[5] !== undefined ? t[5] : null,
              incAuth: t[6] !== undefined ? t[6] : null,
              stdSilv: t[7] !== undefined ? t[7] : null,
              regSilv: t[8] !== undefined ? t[8] : null,
              incSilv: null,
              stdGold: t[9] !== undefined ? t[9] : null,
              regGold: t[10] !== undefined ? t[10] : null,
              incGold: null,
              stdPlat: t[11] !== undefined ? t[11] : null,
              regPlat: t[12] !== undefined ? t[12] : null,
              incPlat: null,
              stdSel: null,
              regSel: null,
              incSel: null
            };
        sortedCalcMsrpRows[i] = entry;
        if (sku) calcSkus[sku] = entry;
      }

      const calcVisibleSheetNames = Array.isArray(rawCalc.calcVisibleSheetNames) && rawCalc.calcVisibleSheetNames.length
        ? rawCalc.calcVisibleSheetNames
        : Object.keys(rawCalc.calcSheetsRaw || {});
      const engineRuntime = rawCalc.engineMeta ? hydrateSophosEngineRuntimeJs(rawCalc.engineMeta) : null;

      return {
        format: rawCalc.format || 'sophos_calc_v1',
        version: rawCalc.version || '',
        effectiveFrom: rawCalc.effectiveFrom || '',
        region: rawCalc.region || 'ASEAN',
        currency: rawCalc.currency || 'USD',
        fileName: rawCalc.fileName || 'calculate_sophos.xlsx',
        updatedAt: rawCalc.updatedAt || 0,
        skuCount: tuples.length,
        calcSkus,
        sortedCalcMsrpRows,
        calcVisibleSheetNames,
        calcHiddenSheetNames: Array.isArray(rawCalc.calcHiddenSheetNames) ? rawCalc.calcHiddenSheetNames : ['MSRPs&BuyCost'],
        calcSheetNames: calcVisibleSheetNames,
        calcSheetsRaw: rawCalc.calcSheetsRaw || {},
        calcSheetsStyled: rawCalc.calcSheetsStyled || {},
        engineMeta: rawCalc.engineMeta || null,
        engineRuntime,
        productByCode
      };
    }

    async function buildWorkbookFromCurrentRefData() {
      const XLSX = await loadSheetJsIfNeeded();
      const wb = XLSX.utils.book_new();
      const fInfo = getActiveFileInfo();

      if (state.fileType === 'acronis_goc' || state.fileType === 'acronis_mau') {
        const sheetsMap = state.fileType === 'acronis_mau'
          ? (refData?.mauSheetsRaw || refData?.gocSheetsRaw || {})
          : (refData?.gocSheetsRaw || refData?.mauSheetsRaw || {});
        Object.entries(sheetsMap).forEach(([sName, rows]) => {
          if (Array.isArray(rows)) {
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sName.slice(0, 31));
          }
        });
      } else if (state.fileType === 'kas_goc' || state.fileType === 'kas_mau') {
        const isMau = state.fileType === 'kas_mau';
        const pivotRows = isMau ? (refData?.mauPivotRaw || refData?.gocPivotRaw || []) : (refData?.gocPivotRaw || []);
        const saleList = isMau ? (refData?.mauSaleRows || refData?.gocSaleRows || []) : (refData?.gocSaleRows || []);
        if (Array.isArray(pivotRows) && pivotRows.length) {
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pivotRows), 'SMB+Enterprise (License)');
        }
        if (Array.isArray(saleList) && saleList.length) {
          const aoa = [
            ['Row', 'PositionCode', 'SKU', 'Product', 'Term', 'Package', 'Type', 'Band', 'Price (VND)'],
            ...saleList.map(r => [r.rowNum, r.posCode, r.sku, r.product, r.term, r.pkg, r.type, r.band, r.price])
          ];
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'SaleListSMB+Enterprise');
        }
      } else if (state.fileType === 'calc' && calcRefData?.calcSheetsRaw) {
        Object.entries(calcRefData.calcSheetsRaw).forEach(([sName, rows]) => {
          if (Array.isArray(rows)) {
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sName.slice(0, 31));
          }
        });
      } else if (state.fileType === 'tg' && refData?.tgSheetsRaw) {
        Object.entries(refData.tgSheetsRaw).forEach(([sName, rows]) => {
          if (Array.isArray(rows)) {
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sName.slice(0, 31));
          }
        });
      } else if (refData?.gocSkus) {
        const setCell = (ws, r1, c0, val) => {
          if (val === undefined || val === null || val === '') return;
          const addr = XLSX.utils.encode_cell({ r: r1 - 1, c: c0 });
          ws[addr] = typeof val === 'number' ? { t: 'n', v: val } : { t: 's', v: String(val) };
        };

        // 1. Sheet SKU_Tab (sophos-pricelist-reseller_SKU_list-asean-usd-2026-3.0: dòng liên tục từ dòng 8, cột G là SKU)
        if (sortedSkuTabCache.length) {
          const wsSku = {};
          setCell(wsSku, 1, 0, 'SOPHOS RESELLER SKU LIST (ASEAN - USD - 2026 3.0)');
          setCell(wsSku, 6, 9, 'giá tham khảo');
          const skuHeaders = [
            'Changes made in Pricelist version', 'Change Key', 'Previous Description', 'Previous Price',
            'SKU Availability Status', 'Product Code', 'SKU', 'Old SKU', 'Description', 'MSRP/RRP',
            'Min Qty', 'Max Qty', 'Term', 'Sector', 'Transaction Type', 'Product Family', 'Product Type',
            'HS Code', 'Country of Origin',
            'Standard Authorized Reseller Cost', 'Registered Authorized Reseller Cost', 'Incumbent Authorized Reseller Cost',
            'Standard Silver Reseller Cost', 'Registered Silver Reseller Cost',
            'Standard Gold Reseller Cost', 'Registered Gold Reseller Cost',
            'Standard Platinum Reseller Cost', 'Registered Platinum Reseller Cost'
          ];
          skuHeaders.forEach((h, i) => setCell(wsSku, 7, i, h));
          sortedSkuTabCache.forEach((it, idx) => {
            const r = 8 + idx;
            [
              it.changeVer, it.changeKey, '', it.prevPrice,
              it.status || 'Available', it.pc, it.sku, it.oldSku, it.desc, it.msrp,
              1, 9999999, it.term, it.sector || 'CORP', it.transType || 'New', it.family || 'UTM/Network Security', it.prodType,
              it.hsCode, it.coo,
              it.stdAuth, it.regAuth, it.incAuth,
              it.stdSilv, it.regSilv,
              it.stdGold, it.regGold,
              it.stdPlat, it.regPlat
            ].forEach((v, cIdx) => setCell(wsSku, r, cIdx, v));
          });
          wsSku['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: 7 + sortedSkuTabCache.length - 1, c: 27 } });
          XLSX.utils.book_append_sheet(wb, wsSku, 'SKU_Tab');
        }

        // 2. Sheet HW_Compliance (đặt đúng dòng gốc rObj.rowNum)
        if (Array.isArray(refData.hwComplianceRaw) && refData.hwComplianceRaw.length) {
          const wsHw = {};
          let maxHwR = 10;
          for (const rObj of refData.hwComplianceRaw) {
            if (rObj && rObj.rowNum >= 1) {
              if (rObj.rowNum > maxHwR) maxHwR = rObj.rowNum;
              (rObj.cells || []).forEach((v, idx) => setCell(wsHw, rObj.rowNum, idx, v));
            }
          }
          wsHw['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxHwR - 1, c: 15 } });
          XLSX.utils.book_append_sheet(wb, wsHw, 'HW_Compliance');
        }

        // 3. Sheet Firewall (giữ nguyên đúng số dòng 1..62)
        if (Array.isArray(refData.gocFirewallRaw) && refData.gocFirewallRaw.length) {
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(refData.gocFirewallRaw), 'Firewall');
        }
      }

      if (!wb.SheetNames.length) {
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['File', fInfo.name || 'Excel']]), 'Sheet1');
      }
      return { XLSX, wb };
    }

    function getOfficeActiveCellParam() {
      let targetSheet = String(state.sheet || '').trim();
      let targetR = Number(state.targetRow) || 1;
      let cleanCol = String(state.colLetter || 'B').trim().toUpperCase();
      const cleanSku = String(state.sku || '').trim().toUpperCase();

      if (state.fileType === 'calc') {
        if (!targetSheet || targetSheet === 'MSRPs&BuyCost' || targetSheet === 'Drop_Downs' || targetSheet === 'Features') {
          const ctx = ensureActiveCalcContext();
          targetSheet = (ctx && ctx.nativeSheet) || 'Firewall';
          if (calcRefData && calcRefData.engineRuntime && ctx && calcRefData.calcSheetsRaw && calcRefData.calcSheetsRaw[targetSheet]) {
            const ov = overlayCalculatedSheetAoaJs(calcRefData, targetSheet, calcRefData.calcSheetsRaw[targetSheet], ctx);
            targetR = ov.targetRow;
            cleanCol = ov.targetColLetter;
          } else {
            targetR = getCalcFirewallRowForItem(state.itemName, cleanSku) || 29;
            cleanCol = 'H';
          }
        }
      } else if (state.fileType === 'goc' || state.fileType === 'skulist') {
        if (targetSheet === 'HW_Compliance') {
          cleanCol = cleanCol || 'B';
        } else {
          targetSheet = 'SKU_Tab';
          if (cleanCol === 'B' || cleanCol === 'H' || !cleanCol) {
            cleanCol = 'G';
          }
          const matched = sortedSkuTabCache.find(x =>
            (cleanSku && x.sku === cleanSku) ||
            (cleanSku && String(x.oldSku || '').trim().toUpperCase() === cleanSku) ||
            x.skuTabRow === targetR ||
            x.rowNum === targetR
          );
          if (matched && matched.skuTabRow) {
            targetR = matched.skuTabRow;
          }
        }
      }

      const cellRef = `${cleanCol}${targetR}`;
      if (!targetSheet) return encodeURIComponent(cellRef);
      const escapedSheet = targetSheet.replace(/'/g, "''");
      return encodeURIComponent(`'${escapedSheet}'!${cellRef}`).replace(/'/g, '%27');
    }

    async function ensureExcelUrlForOfficeView() {
      const fInfo = getActiveFileInfo();
      const rawUrl = String(fInfo.url || '').trim();
      if (rawUrl && !rawUrl.toLowerCase().endsWith('.json')) {
        return rawUrl;
      }

      // Nếu file cũ đang lưu dưới dạng .json -> Tạo file .xlsx đẩy lên Cloudinary để ViewOffice đọc được
      const { XLSX, wb } = await buildWorkbookFromCurrentRefData();
      const outBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
      const blob = new Blob([outBuffer], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });
      const safeName = String(fInfo.name || 'vendor_ref').replace(/\.(xlsb|xls|xlsx|json)$/i, '') + '_slim_viewoffice.xlsx';
      const formData = new FormData();
      formData.append('file', blob, safeName);
      formData.append('upload_preset', 'upload_file');
      const res = await fetch('https://api.cloudinary.com/v1_1/db6fzs3rh/raw/upload', {
        method: 'POST',
        body: formData
      });
      if (!res.ok) {
        throw new Error('Không thể tạo file .xlsx trên Cloudinary cho ViewOffice');
      }
      const data = await res.json();
      const newUrl = data.secure_url;
      if (vendorMeta && newUrl) {
        if (state.fileType === 'calc') vendorMeta.calc_file_url = newUrl;
        else if (state.fileType.includes('goc')) vendorMeta.goc_file_url = newUrl;
        else if (state.fileType === 'tg') vendorMeta.tg_file_url = newUrl;
        else if (state.fileType === 'skulist') vendorMeta.skulist_file_url = newUrl;
        else vendorMeta.mau_file_url = newUrl;
      }
      return newUrl;
    }

    }

    async function downloadActiveFile() {
      const fInfo = getActiveFileInfo();
      const fileName = fInfo.name || 'bang_gia.xlsx';

      // Nếu là file lớn (>10MB) đã chia mảnh nguyên vẹn trên Cloudinary -> Ghép lại đúng 100% file gốc khi tải về
      if (Array.isArray(fInfo.chunkUrls) && fInfo.chunkUrls.length > 0) {
        try {
          const parts = await Promise.all(fInfo.chunkUrls.map(async u => {
            const res = await fetch(u);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.arrayBuffer();
          }));
          const blob = new Blob(parts, {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          });
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 8000);
          return;
        } catch (chunkErr) {
          console.warn('Lỗi tải mảnh file lớn, chuyển sang link dự phòng:', chunkErr);
        }
      }

      const rawUrl = String(fInfo.url || '').trim();

      if (rawUrl && !rawUrl.toLowerCase().endsWith('.json')) {
        try {
          const res = await fetch(rawUrl);
          if (res.ok) {
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
            return;
          }
        } catch (_) {}
        window.open(rawUrl, '_blank', 'noopener,noreferrer');
        return;
      }

      try {
        const { XLSX, wb } = await buildWorkbookFromCurrentRefData();
        const outName = fileName.replace(/\.(xlsb|xls)$/i, '.xlsx');
        XLSX.writeFile(wb, outName);
      } catch (err) {
        alert('Lỗi tải file: ' + (err.message || err));
      }
    }

    function hydrateViewerRefData(raw, isAcronisMode, isKasMode) {
      if (!raw || typeof raw !== 'object') return raw;
      if (isAcronisMode) {
        const gocItems = Array.isArray(raw.gocItems) ? raw.gocItems : [];
        const mauItems = Array.isArray(raw.mauItems) ? raw.mauItems : [];
        const gocBySku = { ...(raw.gocBySku || {}) };
        const gocBySkuFor = { ...(raw.gocBySkuFor || {}) };
        const gocByMaHang = { ...(raw.gocByMaHang || {}) };
        for (const item of gocItems) {
          if (!item) continue;
          const s = String(item.sku || '').trim().toUpperCase();
          const sf = String(item.skuFor || '').trim().toUpperCase();
          const m = String(item.maHang || '').trim().toUpperCase();
          if (s && !gocBySku[s]) gocBySku[s] = item;
          if (sf && !gocBySkuFor[sf]) gocBySkuFor[sf] = item;
          if (m) gocByMaHang[m] = item;
        }
        const mauBySku = { ...(raw.mauBySku || {}) };
        const mauBySkuFor = { ...(raw.mauBySkuFor || {}) };
        const mauByMaHang = { ...(raw.mauByMaHang || {}) };
        for (const item of mauItems) {
          if (!item) continue;
          const s = String(item.sku || '').trim().toUpperCase();
          const sf = String(item.skuFor || '').trim().toUpperCase();
          const m = String(item.maHang || '').trim().toUpperCase();
          if (s && !mauBySku[s]) mauBySku[s] = item;
          if (sf && !mauBySkuFor[sf]) mauBySkuFor[sf] = item;
          if (m) mauByMaHang[m] = item;
        }
        return {
          ...raw,
          gocItems,
          mauItems,
          gocBySku,
          gocBySkuFor,
          gocByMaHang,
          mauBySku,
          mauBySkuFor,
          mauByMaHang
        };
      }
      if (isKasMode) {
        const gocSaleRows = Array.isArray(raw.gocSaleRows) ? raw.gocSaleRows : [];
        const mauSaleRows = Array.isArray(raw.mauSaleRows) ? raw.mauSaleRows : [];
        const gocSaleBySkuBand = { ...(raw.gocSaleBySkuBand || {}) };
        for (const r of gocSaleRows) {
          if (!r || !r.sku || !r.band) continue;
          const key = `${String(r.sku).trim().toUpperCase()}||${String(r.band).trim()}`;
          if (!gocSaleBySkuBand[key]) gocSaleBySkuBand[key] = r;
        }
        const mauSaleBySkuBand = { ...(raw.mauSaleBySkuBand || {}) };
        for (const r of mauSaleRows) {
          if (!r || !r.sku || !r.band) continue;
          const key = `${String(r.sku).trim().toUpperCase()}||${String(r.band).trim()}`;
          if (!mauSaleBySkuBand[key]) mauSaleBySkuBand[key] = r;
        }
        return {
          ...raw,
          gocSaleRows,
          mauSaleRows,
          gocSaleBySkuBand,
          mauSaleBySkuBand
        };
      }
      return raw;
    }

    async function init() {
      try {
        const savedCtx = localStorage.getItem('sophos_excel_viewer_context');
        if (savedCtx) {
          viewerContext = JSON.parse(savedCtx);
        }
      } catch (_) {}

      const params = new URLSearchParams(window.location.search);
      const explicitSheetParam = params.get('sheet') || '';
      const explicitRowParam = params.get('row') || '';
      const explicitColParam = params.get('col') || '';
      state.fileType = params.get('file') || 'tg';
      if (state.fileType === 'calc' && explicitSheetParam === 'MSRPs&BuyCost') {
        showHiddenCalcSheets = true;
      }
      state.sheet = explicitSheetParam || (
        (state.fileType === 'acronis_goc' || state.fileType === 'acronis_mau')
          ? 'Protect Standard'
          : ((state.fileType === 'kas_goc' || state.fileType === 'kas_mau')
            ? 'SMB+Enterprise (License)'
            : (state.fileType === 'calc'
              ? 'Firewall'
              : (state.fileType === 'goc' ? 'MSRPs&BuyCost' : (state.fileType === 'skulist' ? 'SKU_Tab' : 'XGS - 1U + 10%'))))
      );
      state.targetRow = parseInt(explicitRowParam || '1', 10) || 1;
      state.colLetter = (explicitColParam || (state.fileType === 'skulist' && state.sheet === 'SKU_Tab' ? 'G' : (state.fileType === 'calc' && state.sheet === 'Firewall' ? 'H' : 'B'))).toUpperCase();
      state.colIndex = letterToColIndex(state.colLetter);
      state.sku = (params.get('sku') || '').toUpperCase();
      state.itemName = params.get('name') || '';
      state.band = params.get('band') || '';
      state.viewMode = params.get('mode') === 'office' ? 'office' : 'grid';

      const isAcronisMode = state.fileType === 'acronis_goc' || state.fileType === 'acronis_mau';
      const isKasMode = state.fileType === 'kas_goc' || state.fileType === 'kas_mau';
      const vendorKey = isAcronisMode ? 'acronis' : (isKasMode ? 'kaspersky' : 'sophos');

      try {
        const metaRes = await fetch(`https://chusonproject-default-rtdb.asia-southeast1.firebasedatabase.app/vendor_ref_files/${vendorKey}.json`);
        vendorMeta = metaRes.ok ? await metaRes.json() : null;
        const hasMainIndex = Boolean(vendorMeta && vendorMeta.index_url);
        const hasCalcIndex = vendorKey === 'sophos' && Boolean(
          vendorMeta && (vendorMeta.calc_index_url || (Array.isArray(vendorMeta.calc_index_chunk_urls) && vendorMeta.calc_index_chunk_urls.length > 0))
        );
        if (!vendorMeta || (!hasMainIndex && !hasCalcIndex)) {
          throw new Error(`Chưa có File Tham Chiếu của ${vendorKey.toUpperCase()} trên Cloudinary. Vui lòng upload file mới lên Cloudinary tại màn hình Quản lý Hàng Hóa!`);
        }

        const tasks = [];
        if (hasMainIndex) {
          tasks.push(
            fetch(vendorMeta.index_url)
              .then(res => {
                if (!res.ok) throw new Error(`Không tải được dữ liệu gốc từ Cloudinary (HTTP ${res.status}).`);
                return res.json();
              })
              .then(rawJson => {
                refData = hydrateViewerRefData(rawJson, isAcronisMode, isKasMode);
              })
              .catch(err => {
                if (state.fileType !== 'calc') throw err;
                console.warn('Không tải được index_url phụ:', err);
              })
          );
        }
        if (hasCalcIndex) {
          const calcSrc = Array.isArray(vendorMeta.calc_index_chunk_urls) && vendorMeta.calc_index_chunk_urls.length > 0
            ? vendorMeta.calc_index_chunk_urls
            : vendorMeta.calc_index_url;
          tasks.push(
            fetchAndUnzipCalcIndex(calcSrc)
              .then(rawCalc => {
                calcRefData = hydrateCalcViewerData(rawCalc);
              })
              .catch(err => {
                if (state.fileType === 'calc') throw err;
                console.warn('Không tải được calc_index_url:', err);
              })
          );
        }

        await Promise.all(tasks);
        if (!refData && !calcRefData) {
          throw new Error('Không thể giải mã dữ liệu tham chiếu từ Cloudinary.');
        }
      } catch (err) {
        const container = document.getElementById('gridContainer');
        container.innerHTML = `<div style="margin: 40px auto; max-width: 680px; padding: 24px 28px; border-radius: 10px; background: #fef2f2; border: 2px solid #ef4444; color: #991b1b; font-size: 14px; line-height: 1.6;">
          <div style="font-size: 17px; font-weight: 800; margin-bottom: 8px;">⚠️ Không tải được File Tham Chiếu từ Cloudinary</div>
          <div>${escapeHtml(err.message || String(err))}</div>
          <div style="margin-top: 10px; font-size: 12.5px; color: #7f1d1d;">Hệ thống đã tắt chế độ đọc file tĩnh cũ để tránh nhầm lẫn giá. Vui lòng quay lại trang Quản lý Hàng Hóa và bấm <strong>☁️ Upload File mới lên Cloudinary</strong>.</div>
        </div>`;
        return;
      }

      // Build sorted MSRPs&BuyCost cache & SKU_Tab cache
      if (refData) {
        const gocMap = refData.gocSkus || {};
        const arrMsrp = [];
        const arrSkuTab = [];
        for (const [sku, info] of Object.entries(gocMap)) {
          if (info && info.rowNum) {
            arrMsrp.push({ sku, ...info });
          }
          if (info && info.skuTabRow) {
            arrSkuTab.push({ sku, ...info });
          }
        }
        arrMsrp.sort((a, b) => a.rowNum - b.rowNum);
        arrSkuTab.sort((a, b) => a.skuTabRow - b.skuTabRow);
        sortedMsrpCache = arrMsrp;
        sortedSkuTabCache = arrSkuTab;
      }
      if (calcRefData) {
        sortedCalcMsrpCache = calcRefData.sortedCalcMsrpRows || [];
        const ctx = ensureActiveCalcContext();
        if (state.fileType === 'calc' && state.sheet !== 'MSRPs&BuyCost' && calcRefData.engineRuntime && ctx) {
          if (!explicitSheetParam) {
            state.sheet = ctx.nativeSheet || 'Firewall';
          }
          if (!explicitRowParam && calcRefData.calcSheetsRaw && calcRefData.calcSheetsRaw[state.sheet]) {
            const ov = overlayCalculatedSheetAoaJs(calcRefData, state.sheet, calcRefData.calcSheetsRaw[state.sheet], ctx);
            state.targetRow = ov.targetRow;
            state.colLetter = explicitColParam ? state.colLetter : ov.targetColLetter;
            state.colIndex = letterToColIndex(state.colLetter);
          }
        }
      }

      renderAll();
      scrollToTargetRow();
      copyRowCoord(true);
    }

    init();
  </script>
